[project]
name = "server"
version = "0.1.0"
description = "A simple FastAPI server for Azure KMS development"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.12.15",
    "azure-storage-blob>=12.26.0",
    "docx2txt>=0.9",
    "fastapi>=0.116.1",
    "langchain>=0.3.27",
    "pydantic-settings>=2.10.1",
    "pymupdf>=1.26.3",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
]
